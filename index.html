<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Interés Simple</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 1.5rem;
            color: #1f2937;
            margin-top: 0;
            text-align: center;
        }
        .formula {
            background: #eef2ff;
            color: #3730a3;
            padding: 0.6rem;
            border-radius: 6px;
            text-align: center;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.4rem;
            color: #374151;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .result {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 6px;
            display: none;
        }
        .result p {
            margin: 0.4rem 0;
            color: #166534;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Interés Simple</h1>
    <div class="formula">I = C × r × t</div>

    <div class="form-group">
        <label for="capital">Capital inicial ($):</label>
        <input type="number" id="capital" placeholder="Ej. 1000000" min="0" step="any">
    </div>

    <div class="form-group">
        <label for="tasa">Tasa de interés anual (%):</label>
        <input type="number" id="tasa" placeholder="Ej. 12" min="0" step="any">
    </div>

    <div class="form-group">
        <label for="tiempo">Tiempo (en años):</label>
        <input type="number" id="tiempo" placeholder="Ej. 2" min="0" step="any">
    </div>

    <button onclick="calcularInteres()">Calcular</button>

    <div class="result" id="resultado">
        <p><strong>Interés generado (I):</strong> <span id="interesTotal"></span></p>
        <p><strong>Monto final (C + I):</strong> <span id="montoFinal"></span></p>
    </div>
</div>

<script>
    function calcularInteres() {
        const capital = parseFloat(document.getElementById('capital').value);
        const tasa = parseFloat(document.getElementById('tasa').value);
        const tiempo = parseFloat(document.getElementById('tiempo').value);

        if (isNaN(capital) || isNaN(tasa) || isNaN(tiempo) || capital < 0 || tasa < 0 || tiempo < 0) {
            alert("Por favor, ingresa valores numéricos válidos y positivos en todos los campos.");
            return;
        }

        const interes = capital * (tasa / 100) * tiempo;
        const total = capital + interes;

        const formatoMoneda = new Intl.NumberFormat('es-CO', {
            style: 'currency',
            currency: 'COP',
            minimumFractionDigits: 2
        });

        document.getElementById('interesTotal').textContent = formatoMoneda.format(interes);
        document.getElementById('montoFinal').textContent = formatoMoneda.format(total);
        document.getElementById('resultado').style.display = 'block';
    }
</script>

</body>
</html>
